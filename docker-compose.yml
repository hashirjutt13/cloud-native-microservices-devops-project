services:
  user-service:
    build: ./services/user
    image: cloud-final/user-service:local
    environment:
      NODE_ENV: development
      PORT: 3001
    ports:
      - "3001:3001"

  product-service:
    build: ./services/product
    image: cloud-final/product-service:local
    environment:
      NODE_ENV: development
      PORT: 3002
    ports:
      - "3002:3002"

  order-service:
    build: ./services/order
    image: cloud-final/order-service:local
    environment:
      NODE_ENV: development
      PORT: 3003
      PRODUCT_SERVICE_URL: http://product-service:3002
      NOTIFICATION_SERVICE_URL: http://notification-service:3004
    depends_on:
      - product-service
      - notification-service
    ports:
      - "3003:3003"

  notification-service:
    build: ./services/notification
    image: cloud-final/notification-service:local
    environment:
      NODE_ENV: development
      PORT: 3004
    ports:
      - "3004:3004"

  frontend:
    build: ./frontend
    image: cloud-final/frontend:local
    depends_on:
      - user-service
      - product-service
      - order-service
      - notification-service
    ports:
      - "8080:80"
