apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: cloud-final-services
        metrics_path: /health
        static_configs:
          - targets:
              - user-service:3001
              - product-service:3002
              - order-service:3003
              - notification-service:3004
